const objects=DATA.objects, photoCatalog=DATA.photoCatalog, hdMap=DATA.hdMap;
const typeNames={galaxy_spiral:"旋涡星系",galaxy_barred:"棒旋星系",galaxy_elliptical:"椭圆星系",galaxy_lenticular:"透镜星系",galaxy_irregular:"不规则星系",galaxy_dwarf:"矮星系",group:"星系群",cluster:"星系团",supercluster:"超星系团",filament:"纤维 / 长城",void:"宇宙空洞",quasar:"类星体",blackhole:"黑洞",globular:"球状星团"};
const categories=[["all","全部"],["galaxy","星系"],["globular","球状星团"],["group","星系群"],["cluster","星系团"],["large","大尺度结构"],["exotic","黑洞 / 类星体"]];
const byCode=new Map(objects.map(o=>[o.code,o]));
let category="all", query="", selected=objects[0];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const group=t=>t.startsWith("galaxy")?"galaxy":t==="globular"?"globular":t==="group"?"group":(t==="cluster"||t==="supercluster")?"cluster":(t==="filament"||t==="void")?"large":"exotic";
const fmtLy=v=>v==null?"未记录":v<1e4?Math.round(v).toLocaleString()+" 光年":v<1e8?(v/1e4).toFixed(v<1e5?2:0)+" 万光年":v<1e12?(v/1e8).toFixed(v<1e9?2:1)+" 亿光年":(v/1e12).toFixed(2)+" 万亿光年";
const fmtDeg=v=>v==null?"未记录":v.toFixed(3)+"°";
const img=o=>{const p=photoCatalog[o.photoKey]||{};return (o.imageHd?"./data/hd/"+encodeURIComponent(o.photoKey)+".jpg":"./data/photo/"+encodeURIComponent(p.file||o.photoKey+".jpg"));};
const cleanName=o=>o.nameEn||o.name.replace(/^(.+?)(?=s+(?:M|NGC|IC))/,"$1")||o.code.split(":")[1].replace(/_/g," ");
const sourceText=o=>group(o.type)==="galaxy"?"SDSS / 2MRS / 2dFGRS 巡天星表；项目档案坐标、距离与直径需以后续定标为准。":o.type==="globular"?"Harris 球状星团表（VII/202）；项目档案记录坐标、距离与积分星等。":"SDSS / 2MRS / 2dFGRS 巡天星表及项目整理的大尺度结构目录。";
function links(o){const name=cleanName(o),q=encodeURIComponent(name),ra=o.ra,de=o.decl;return [["SIMBAD","https://simbad.u-strasbg.fr/simbad/sim-id?Ident="+q],["NED","https://ned.ipac.caltech.edu/byname?objname="+q],["SDSS SkyServer",ra!=null&&de!=null?"https://skyserver.sdss.org/dr18/VisualTools/navi?ra="+ra+"&dec="+de+"&scale=0.2":""],["VizieR",ra!=null&&de!=null?"https://vizier.cds.unistra.fr/viz-bin/VizieR?-c="+ra+","+de+"&-c.rs=10":""],["ADS 文献","https://ui.adsabs.harvard.edu/search/q="+encodeURIComponent('object:"'+name+'"')]].filter(x=>x[1]);}
function renderFilters(){$("#filters").innerHTML=categories.map(c=>{const n=c[0]==="all"?objects.length:objects.filter(o=>group(o.type)===c[0]).length;return '<button class="filter'+(category===c[0]?" on":"")+'" data-c="'+c[0]+'">'+c[1]+' '+n+"</button>"}).join("");document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{category=b.dataset.c;renderAll();});}
function filtered(){const s=query.trim().toLowerCase();return objects.filter(o=>(category==="all"||group(o.type)===category)&&(!s||[o.name,o.nameEn,o.alias,o.code,typeNames[o.type]].join(" ").toLowerCase().includes(s)));}
function renderList(){const list=filtered();$("#count").textContent=list.length+" / "+objects.length+" 条";$("#list").innerHTML=list.map(o=>'<button class="item'+(o===selected?" on":"")+'" role="option" aria-selected="'+(o===selected)+'" data-code="'+esc(o.code)+'"><b>'+esc(o.name)+'</b><span class="badge">'+(typeNames[o.type]||o.type)+'</span><small>'+esc(o.nameEn||o.code)+'</small><small>'+fmtLy(o.distanceLy)+'</small></button>').join("")||'<div class="empty">没有匹配条目</div>';$("#list").querySelectorAll(".item").forEach(b=>b.onclick=()=>select(b.dataset.code,true));}
function overview(o){return o.name+" 是项目当前档案中的"+(typeNames[o.type]||"天体")+"。条目记录赤经 "+fmtDeg(o.ra)+"、赤纬 "+fmtDeg(o.decl)+"，距离为 "+fmtLy(o.distanceLy)+"。"+(o.description||"当前版本未记录逐对象概述；以下参数来自项目归档数据，展示为可核查档案而非推测性科普文本。");}
function skyText(){return "授权浏览器获取本地经纬度后，将按当前系统时间给出近似地平高度和方位角。这是便于观察的平面天球近似，不包含大气折射、岁差章动和站点时区修正的完整精密星历。";}
function article(o){const p=photoCatalog[o.photoKey]||{};const imageTitle=o.imageTitle||p.title||"项目影像档案";const credit=o.imageCredit||p.credit||"许可信息未记录，发布前应复核";const exact=o.imageExact&&!o.photoFallback;const rel=objects.filter(x=>x!==o&&group(x.type)===group(o.type)).sort((a,b)=>Math.abs((a.distanceLy||0)-(o.distanceLy||0))).slice(0,6);return '<article class="hero"><figure class="imagebox"><img src="'+img(o)+'" alt="'+esc(o.name)+' 的观测影像'+(exact?"":"（同类型参考）")+'" loading="eager"><figcaption>'+esc(imageTitle)+' · '+esc(credit)+'</figcaption></figure><div class="title"><h2>'+esc(o.name)+'<span class="truth '+(exact?"exact":"demo")+'">'+(exact?"目标影像":"类型参考影像")+'</span></h2><div class="en">'+esc(o.nameEn||o.alias||o.code)+'</div><p class="summary">'+esc(overview(o))+'</p><div class="facts"><div class="fact"><small>类别</small><b>'+(typeNames[o.type]||esc(o.type))+'</b></div><div class="fact"><small>距离</small><b>'+fmtLy(o.distanceLy)+'</b></div><div class="fact"><small>视直径 / 跨度</small><b>'+fmtLy(o.diameterLy)+'</b></div><div class="fact"><small>视星等</small><b>'+(o.magnitude==null?"未记录":o.magnitude.toFixed(2))+'</b></div></div></div></article><div class="sections"><section class="card"><h3>观测参数</h3><table><tr><td>赤经</td><td>'+fmtDeg(o.ra)+'</td></tr><tr><td>赤纬</td><td>'+fmtDeg(o.decl)+'</td></tr><tr><td>倾角</td><td>'+fmtDeg(o.incl)+'</td></tr><tr><td>位置角</td><td>'+fmtDeg(o.pa)+'</td></tr><tr><td>本星系群</td><td>'+(o.localGroup?"是":"否 / 未记录")+'</td></tr></table></section><section class="card"><h3>此刻天空</h3><p>'+skyText()+'</p><p id="skyStatus">未获取本地位置；不会上传坐标。</p><button class="ghost" id="locate">使用本机位置估算</button></section><section class="card wide"><h3>数据来源</h3><p>'+esc(sourceText(o))+'</p><p>影像溯源：'+(o.imageUrl?'<a href="'+esc(o.imageUrl)+'" target="_blank" rel="noopener">'+esc(o.imageUrl)+'</a>':"未记录单图链接")+'</p><p>署名 / 许可：'+esc(credit)+'</p><div class="note">'+(exact?"该影像与条目一一对应。":"该影像按同类真实影像展示，不表示拍摄对象就是本条目标；不得在对外材料中称为目标实拍。")+'</div></section><section class="card wide"><h3>参考文献与外部数据库</h3><div class="links">'+links(o).map(x=>'<a href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+" ↗</a>").join("")+'</div><p>DOI：当前档案未记录该条目的逐对象 DOI；外部页面内容由各数据库维护。</p></section><section class="card wide"><h3>相关条目</h3><div class="related">'+rel.map(x=>'<button data-code="'+esc(x.code)+'"><b>'+esc(x.name)+'</b><span>'+(typeNames[x.type]||x.type)+' · '+fmtLy(x.distanceLy)+'</span></button>').join("")+'</div></section></div><footer class="foot">ORBIT 天体维基 · 功能重建版。原始 catalog.html 未找到，本页基于当前归档数据重建并保留真实性标注。</footer>';}
function bindArticle(){$("#main").querySelectorAll(".related button").forEach(b=>b.onclick=()=>select(b.dataset.code,true));const btn=$("#locate");if(btn)btn.onclick=()=>{if(!navigator.geolocation){$("#skyStatus").textContent="当前浏览器不支持定位。";return}$("#skyStatus").textContent="正在请求本机位置权限…";navigator.geolocation.getCurrentPosition(pos=>showSky(selected,pos.coords.latitude,pos.coords.longitude),err=>$("#skyStatus").textContent="未获得位置权限："+err.message,{enableHighAccuracy:false,timeout:10000});};}
function showSky(o,lat,lon){if(o.ra==null||o.decl==null){$("#skyStatus").textContent="该条目缺少坐标，无法估算。";return}const days=Date.now()/86400000+2440587.5-2451545;let lst=(280.46061837+360.98564736629*days+lon)%360;if(lst<0)lst+=360;let h=(lst-o.ra+540)%360-180;const rad=Math.PI/180,alt=Math.asin(Math.sin(o.decl*rad)*Math.sin(lat*rad)+Math.cos(o.decl*rad)*Math.cos(lat*rad)*Math.cos(h*rad))/rad,az=(Math.atan2(Math.sin(h*rad),Math.cos(h*rad)*Math.sin(lat*rad)-Math.tan(o.decl*rad)*Math.cos(lat*rad))/rad+180)%360;$("#skyStatus").textContent="近似高度 "+alt.toFixed(1)+"°，方位角 "+az.toFixed(1)+"°（0° 为北）。"+(alt>0?"当前在地平线上方。":"当前在地平线下方。");}
function select(code,focus){selected=byCode.get(code)||selected;$("#main").innerHTML=article(selected);bindArticle();history.replaceState(null,"","?q="+encodeURIComponent(selected.code));renderList();if(focus)$("#main").focus({preventScroll:true});}
function renderAll(){renderFilters();if(!filtered().includes(selected))selected=filtered()[0]||selected;$("#main").innerHTML=selected?article(selected):'<div class="empty">没有匹配条目</div>';bindArticle();renderList();}
$("#q").addEventListener("input",e=>{query=e.target.value;renderAll();});
const initial=new URLSearchParams(location.search).get("q");if(initial&&byCode.has(initial))selected=byCode.get(initial);
renderAll();window.__ORBIT_CATALOG__={version:"reconstructed-2026-11-17",count:objects.length,select:select,info:()=>({count:objects.length,filtered:filtered().length,selected:selected.code,category,query,imageExact:objects.filter(o=>o.imageExact&&!o.photoFallback).length})};
</script>
