  const inverseError = maxDiff(new T.Matrix4().toArray(), inverse);
  const checks = { returnedTrue: returned === true, journeyOff: !s.journeyInfo.on, upCleared: cs.upCur === null,
    standardProjection: diff < 1e-12, inverseConsistent: inverseError < 1e-10,
    generationUnchanged: r.generation === gen,
    historyPreserved: r.restores === records && oldRecords.every((x, i) => r.restores[i] === x),
    freshStopRecord: added.length === 1 && !oldRecords.includes(added[0]) && added[0].reason === 'stop' &&
      Number.isFinite(added[0].frame) && added[0].frame >= active.handoff.frame &&
      maxDiff(added[0].projection || [], actual) < 1e-12 &&
      maxDiff(added[0].inverse || [], cs.cam.projectionMatrixInverse.toArray()) < 1e-12 };
  recordStep('journey-stop', { before, returned, added, checks, projectionDifference: diff, inverseError, after: state() });
  assert(Object.values(checks).every(v => v === true), '停止清理检查失败');
  beginBudget(report.limits.stopMs, '录制收尾');
  nextFrames(token, () => {
    liveToken(token); environmentGuard();
    assert(recorder && recorder.state === 'recording', '录制器未处于recording状态');
    recorder.stop();
  });
}
function finalizeVideo(token) {
  liveToken(token); environmentGuard();
  assert(recorder && recorder.state === 'inactive', '录制器尚未停止');
  assert(videoChunks.length > 0, '没有收到视频数据块');
  videoBlob = new window.Blob(videoChunks, { type: report.video.mimeType || 'video/webm' });
  report.video.blobCreated = true; report.video.chunks = videoChunks.length; report.video.bytes = videoBlob.size;
  report.video.stopWall = new Date().toISOString(); report.video.stopMonotonicMs = performance.now();
  report.video.durationMs = report.video.stopMonotonicMs - report.video.startMonotonicMs;
  assert(report.video.bytes > 0, '录制视频为空');
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  report.video.downloadName = 'rh-v4-continuity-' + stamp + '.webm';
  if (videoURL) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(videoBlob);
  recordStep('video-stopped', { video: clone(report.video), telemetryEntries: report.telemetry.length });
  assert(report.errors.length === 0, '存在错误，禁止提交通过终态');
  finished = true; run++; cancelWait(); if (monitorTimer !== null) clearInterval(monitorTimer); monitorTimer = null;
  phase = 'finished'; report.status = 'passed-limited'; report.finishedAt = new Date().toISOString();
  lock(); $('json').disabled = false; $('video').disabled = false;
  recordStep('finished', { boundedStateChecksPassed: true, visualApproval: false });
}
function attachRecorderStop(token) {
  liveToken(token);
  recorder.onstop = () => {
    if (dead || finished) return;
    try { finalizeVideo(token); } catch (e) { fail(e); }
  };
}
function refreshForeground() {
  if (dead || finished || candidateStarted) return;
  const visibilityState = document.visibilityState, hasFocus = document.hasFocus();
  const ready = visibilityState === 'visible' && hasFocus;
  $('initialize').disabled = !ready;
  $('status').textContent = (ready ? '前台已就绪：可初始化候选' : '等待前台激活') +
    '（visibility=' + visibilityState + '，focus=' + hasFocus + '）';
}
function initialize() {
  if (dead || finished || candidateStarted) return;
  if (document.visibilityState !== 'visible' || !document.hasFocus()) { refreshForeground(); return; }
  try {
    candidateStarted = true; $('initialize').disabled = true;
    phase = 'loading'; report.status = 'loading';
    loadStarted = performance.now(); loadDeadline = loadStarted + report.limits.loadMs;
    recordStep('foreground-initialize', { environment: liveEnvironment(), loadDeadlineMs: report.limits.loadMs });
    loadTimer = setTimeout(() => fail(Error('候选iframe加载超过15秒')), report.limits.loadMs);
    frame.src = CANDIDATE;
  } catch (e) { fail(e); }
}
lock(); refreshForeground(); show();
async function boot() {
  if (dead || finished) return;
  if (!candidateStarted) return; // Ignore the iframe's initial about:blank load.
  try {
    if (!booting && !booted && frame.contentWindow.location.href === 'about:blank') return;
    if (booting || booted) throw Error('候选iframe重复load/文档重载');
    if (loadTimer !== null) clearTimeout(loadTimer); loadTimer = null;
    booting = true; const token = run; identityDeadline = performance.now() + 10000;
    assert(performance.now() < loadDeadline, '候选iframe加载超过绝对15秒截止时间');
    w = frame.contentWindow; candidateDocument = w.document;
    assert(w.__SE && w.__RH_CANDIDATE__ && w.__rhInternals, '候选接口未就绪');
    originalSeek = w.__SE.journeySeek;
    assert(typeof originalSeek === 'function', '缺少seek诊断接口');
    seekWrapper = function(...args) { observedSeekCalls++; return originalSeek.apply(this, args); };
    w.__SE.journeySeek = seekWrapper;
    w.addEventListener('error', e => fail(Error('候选页面异常：' + e.message)));
    w.addEventListener('unhandledrejection', e => fail(Error('候选未处理拒绝：' + String(e.reason))));
    for (const target of [window, w]) {
      target.addEventListener('pagehide', () => { if (!dead && !finished) fail(Error('页面pagehide')); });
      target.addEventListener('hashchange', () => { if (!dead && !finished) fail(Error('URL fragment变化')); });
    }
    w.document.addEventListener('visibilitychange', visibility);
    environmentGuard();
    report.identity = { environment: liveEnvironment(), expectedIframeURL: new URL(CANDIDATE, location.href).href,
      candidateHoldConfigured: new URL(w.location.href).searchParams.get('candidateHold') === '0',
      moduleURLs: Array.from(w.document.querySelectorAll('script[type="module"][src]')).map(s => s.src),
      build: w.__SE.build, title: w.document.title, clusters: w.__rhInternals.MWGC_LIST.length,
      mainCanvas: canvasInfo(), resources: [], fetchedBytesOnly: true };
    assert(report.identity.candidateHoldConfigured, 'candidateHold未配置为0');
    const timeout = setTimeout(() => fail(Error('身份检查超过10秒')), 10000);
    try { for (const [url, hash] of Object.entries(EXPECTED)) await fingerprint(url, hash, token); }
    finally { clearTimeout(timeout); }
    if (dead || finished) return;
    identityGuard(token); environmentGuard();
    booted = true; booting = false; phase = 'ready'; report.status = 'ready';
    recordStep('identity-ready', { identity: report.identity, state: state() }); offer('record');
    monitorTimer = setInterval(() => {
      if (dead || finished) return;
      try { environmentGuard(); telemetry('watchdog'); checkMissingSource(); show(); }
      catch (e) { fail(e); }
    }, 200);
  } catch (e) { fail(e); }
}
function visibility() {
  if (dead || finished) return;
  try {
    event('visibilitychange', {});
    if (!candidateStarted) { refreshForeground(); return; }
    assert(document.visibilityState === 'visible', '父页面隐藏：停止采样（visibilityState=' + document.visibilityState + '）');
    if (w && candidateDocument) environmentGuard();
  } catch (e) { fail(e); }
}
document.addEventListener('visibilitychange', visibility);
window.addEventListener('focus', refreshForeground);
window.addEventListener('blur', refreshForeground);
window.addEventListener('pagehide', () => { if (!dead && !finished) fail(Error('页面pagehide')); });
window.addEventListener('error', e => fail(Error('面板异常：' + e.message)));
window.addEventListener('unhandledrejection', e => fail(Error('面板未处理拒绝：' + String(e.reason))));
frame.addEventListener('load', boot);
$('initialize').onclick = initialize;
$('record').onclick = () => {
  start();
  if (active && recorder) {
    const token = active.token;
    attachRecorderStop(token);
  }
};
$('json').onclick = () => {
  const u = URL.createObjectURL(new window.Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = u;
  a.download = 'rh-v4-continuity-report-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
};
$('video').onclick = () => {
  if (!videoURL) return;
  const a = document.createElement('a'); a.href = videoURL; a.download = report.video.downloadName; a.click();
};
lock(); refreshForeground(); show();
</script>
