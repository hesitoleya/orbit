# ============================================================
# SPACE·1:1 — Java 后端配置
# 替换原 Node 版 server.mjs，前端（public/）完全不变
# ============================================================

# 监听地址与端口（与原 Node 版保持一致）
server.port=8132
server.address=127.0.0.1

# 前端静态资源根目录（相对于本工程启动目录 server-java/，即 ../public = D:/WB/orbit/public）
# 可通过环境变量覆盖：ORBIT_PUBLIC_DIR=D:/WB/orbit/public
orbit.public.dir=../public

# 启用 gzip 压缩，行为与原 Node 版一致（文本/JSON 超过 1KB 才压缩）
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# 静态资源缓存由 EtagFilter 统一控制（ETag + 304），此处关闭 Boot 自带的强缓存避免冲突
spring.web.resources.cache.period=0
spring.web.resources.cache.use-last-modified=true

# 静态资源实际目录（指向前端 public/，支持环境变量覆盖）
spring.web.resources.static-locations=file:${orbit.public.dir}/

# 应用元信息（供 /api/health 展示，与 package.json 中 version 对齐）
orbit.app.name=space-1to1
orbit.app.version=34
